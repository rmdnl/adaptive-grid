environment:
  mode: testnet
  dry_run: true
  allow_live_execution: false

symbol: BNBUSDT
timeframe: 15m

grid:
  step_pct: 0.006
  hard_min_net_pct: 0.003
  preferred_net_max_pct: 0.004
  min_cells: 6
  max_levels: 40

range:
  mode: auto
  lower_price: 0
  upper_price: 0
  lookback: 200
  buffer_pct: 0.01
  auto:
    support_quantile: 0.10
    resistance_quantile: 0.90
    min_width_pct: 0.03
    max_width_pct: 0.25
    min_quality_score: 65
    require_price_inside: true

market_filter:
  adx_max: 28
  atr_pct_max: 0.025
  bb_width_max: 0.06
  volume_spike_max: 2.5

# Phase 5A: adaptive grid planner.
# Converts market intelligence into a validated candidate grid plan.
# Uses candle-index-based cooldown (not wall-clock time) and hysteresis
# to avoid unnecessary reconfigurations.
adaptive_planner:
  cooldown_candles: 4
  hysteresis:
    range_change_pct: 0.02       # 2% range shift triggers reconfiguration
    step_change_pct: 0.10        # 10% step change triggers reconfiguration
    grid_count_change: 3         # ±3 cells triggers reconfiguration
    quality_degradation: 5       # score drops by 5 triggers reconfiguration
    regime_change: true          # any regime change triggers reconfiguration

# Phase 4: read-only market regime + liquidity intelligence.
# This block only filters whether the existing fixed-range grid may run. It
# never widens/shrinks the configured range and never predicts price.
market_intelligence:
  timeframe: 15m
  min_candles: 60
  max_candle_age_seconds: 5400
  atr_period: 14
  adx_period: 14
  bb_length: 20
  bb_std_mult: 2.0
  volume_baseline_period: 20
  range_stability_period: 20
  regime:
    adx_trend_min: 25
    atr_expansion_ratio: 1.5
    price_range_inclusion_min: 0.90
    directional_efficiency_max: 0.60
  liquidity:
    max_spread_pct: 0.003
    max_quote_ticker_age_seconds: 10
  quality:
    min_range_quality_score: 60
    weight_trend_stability: 0.25
    weight_volatility_suitability: 0.20
    weight_bb_width_suitability: 0.15
    weight_volume_stability: 0.10
    weight_spread_suitability: 0.10
    weight_range_containment: 0.20

execution:
  prefer_limit_maker: true
  stale_order_minutes: 30
  max_open_orders: 40
  order_quote_size: 25
  total_quote_budget: 0
  max_inventory_pct: 0.70

fees:
  maker_fee_fallback: 0.001
  taker_fee_fallback: 0.001
  slippage_roundtrip_pct: 0.0005

paper:
  initial_base_balance: 2
  initial_quote_balance: 1000
  maker_fee: 0.001
  taker_fee: 0.001
  fee_asset: USDT

risk:
  max_equity_drawdown_pct: 0.02
  range_break_buffer_pct: 0.01
  daily_profit_lock_pct: 0.01
  cooldown_minutes: 30
  # Dedicated 15m candle-close lower-boundary stop (independent of the
  # current-price range-break buffer above).  Kills when the latest CLOSED
  # 15m candle close <= LOWER_PRICE * (1 - stop_if_below_lower_pct).
  stop_if_below_lower_pct: 0.02

logging:
  sqlite_path: ./data/grid_bot.sqlite3
  log_path: ./logs/grid_bot.log
  csv_path: ./logs/trades.csv

# Round 10: continuous runtime (orchestration only — it repeatedly invokes
# the existing authoritative single-cycle main() entrypoint; it places no
# orders and holds no trading logic of its own).  Cadence: one cycle per NEW
# closed candle of `timeframe`, paced by interval_seconds; interval retry
# after a cycle refused.  interval_seconds < timeframe keeps candle-aligned
# operation (15m timeframe ⇒ default 60s is candle-aligned).
runtime:
  enabled: true
  interval_seconds: 60
  boundary_grace_seconds: 15

# Phase 6A: Binance Spot Testnet read-only adapter.
# Credentials come from environment variables (BINANCE_API_KEY, BINANCE_API_SECRET).
# This block only configures transport/safety — never credentials.
binance:
  environment: testnet
  base_url: https://testnet.binance.vision
  timeout_ms: 5000
  retries: 3
  backoff_ms: 1000

environment:
  mode: testnet
  dry_run: true
  allow_live_execution: false

# Multi-symbol configuration (comma-separated, e.g., "BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT")
# Can also be set via SYMBOLS env var
symbols: "BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT"
timeframe: "1h"

grid:
  # Arithmetic for BTC/ETH/BNB, Geometric for SOL
  mode_by_symbol:
    BTCUSDT: "arithmetic"
    ETHUSDT: "arithmetic"
    SOLUSDT: "geometric"
    BNBUSDT: "arithmetic"
  # Legacy fixed step for the single-symbol path (main.py); the multi-symbol
  # path uses the dynamic ATR step below.
  step_pct: 0.006
  # Grid step = GRID_STEP_ATR_MULTIPLIER x ATR(14) (default 1.0) — no fixed
  # floor, no silent cap.  The gross minimum below is a GATE: an ATR step
  # that cannot clear 0.5% gross BLOCKS the grid (recorded, never widened).
  atr_multiplier: 1.0
  min_gross_profit_pct: 0.005
  # Minimum net profit per grid = 0.3% (after fees) — hard floor.
  hard_min_net_pct: 0.003
  preferred_net_max_pct: 0.004
  min_cells: 6
  max_levels: 40

range:
  mode: auto
  lower_price: 0
  upper_price: 0
  lookback: 200
  buffer_pct: 0.01
  auto:
    support_quantile: 0.10
    resistance_quantile: 0.90
    min_width_pct: 0.03
    max_width_pct: 0.25
    min_quality_score: 65
    require_price_inside: true

# Auto-entry / Auto-exit strategy configuration
strategy:
  # Auto-entry: Bot ONLY starts grid if ALL conditions met (AND logic)
  entry:
    adx_max: 25                    # ENTRY: ADX(14) < 25
    rsi_max: 40                    # ENTRY: RSI(14) < 40
    bb_percent_b_max: 0.0          # ENTRY: %B <= 0 (at/below lower Bollinger Band)
    # NOTE: the Volume Oscillator is diagnostics only and NEVER gates entry
    # (locked specification).  The previous ADX<20/RSI<35/VO>0 logic is removed.
  # Auto-exit: Bot MUST exit if ANY condition met (OR logic)
  exit:
    rsi_min: 70                    # EXIT: RSI(14) >= 70
    adx_min: 25                    # EXIT: ADX(14) >= 25
    bb_percent_b_min: 1.0          # EXIT: %B >= 1
    zscore_threshold: 2.5          # EXIT: |Z-Score(20)| >= 2.5 (either extreme)
  # Cooldown after auto-exit
  cooldown_hours: 3                # Hours to wait before new auto-entry allowed

adaptive_planner:
  cooldown_candles: 4
  hysteresis:
    range_change_pct: 0.02
    step_change_pct: 0.10
    grid_count_change: 3
    quality_degradation: 5
    regime_change: true

market_intelligence:
  timeframe: "1h"
  min_candles: 60
  max_candle_age_seconds: 5400
  atr_period: 14
  adx_period: 14
  bb_length: 20
  bb_std_mult: 2.0
  volume_baseline_period: 20
  range_stability_period: 20
  regime:
    adx_trend_min: 25
    atr_expansion_ratio: 1.5
    price_range_inclusion_min: 0.90
    directional_efficiency_max: 0.60
  liquidity:
    max_spread_pct: 0.003
    max_quote_ticker_age_seconds: 10
  quality:
    min_range_quality_score: 60
    weight_trend_stability: 0.25
    weight_volatility_suitability: 0.20
    weight_bb_width_suitability: 0.15
    weight_volume_stability: 0.10
    weight_spread_suitability: 0.10
    weight_range_containment: 0.20

execution:
  prefer_limit_maker: true
  stale_order_minutes: 30
  max_open_orders: 40
  order_quote_size: 25
  total_quote_budget: 0
  max_inventory_pct: 0.70
  # Testnet execution bridge (real orders) — double-gated, DEFAULT OFF.
  # Mirroring risk-gated paper orders to real Binance Spot TESTNET
  # LIMIT_MAKER orders requires BOTH this flag AND TESTNET_ORDERS_ENABLED=
  # true in .env.  Live execution is not implemented and stays unreachable.
  testnet_execution: false

fees:
  maker_fee_fallback: 0.001
  taker_fee_fallback: 0.001
  slippage_roundtrip_pct: 0.0005

paper:
  initial_base_balance: 2
  initial_quote_balance: 1000
  maker_fee: 0.001
  taker_fee: 0.001
  fee_asset: USDT

risk:
  max_equity_drawdown_pct: 0.02
  range_break_buffer_pct: 0.01
  daily_profit_lock_pct: 0.01
  cooldown_minutes: 30
  stop_if_below_lower_pct: 0.02

logging:
  sqlite_path: ./data/grid_bot.sqlite3
  log_path: ./logs/grid_bot.log
  csv_path: ./logs/trades.csv

runtime:
  enabled: true
  interval_seconds: 60
  boundary_grace_seconds: 15

binance:
  # Testnet configuration
  testnet:
    environment: testnet
    base_url: https://testnet.binance.vision
    timeout_ms: 5000
    retries: 3
    backoff_ms: 1000
  # Live configuration (credentials from .env)
  live:
    environment: live
    base_url: https://api.binance.com
    timeout_ms: 5000
    retries: 3
    backoff_ms: 1000
environment:
  mode: testnet
  dry_run: true

symbol: BNBUSDT
timeframe: 15m

grid:
  step_pct: 0.006
  target_net_min_pct: 0.003
  target_net_max_pct: 0.004
  hard_min_net_pct: 0.003

range:
  mode: auto
  lower_price: 0
  upper_price: 0
  lookback: 200
  buffer_pct: 0.01
  auto:
    support_quantile: 0.10
    resistance_quantile: 0.90
    min_width_pct: 0.03
    max_width_pct: 0.25
    min_quality_score: 65

market_filter:
  adx_max: 28
  atr_pct_max: 0.025
  bb_width_max: 0.06
  volume_spike_max: 2.5

execution:
  prefer_limit_maker: true
  stale_order_minutes: 30
  max_open_orders: 40
  order_quote_size: 25
  max_inventory_pct: 0.70

fees:
  maker_fee_fallback: 0.001
  taker_fee_fallback: 0.001
  slippage_roundtrip_pct: 0.0005

risk:
  max_equity_drawdown_pct: 0.02
  range_break_buffer_pct: 0.01
  daily_profit_lock_pct: 0.01
  cooldown_minutes: 30

logging:
  sqlite_path: ./data/grid_bot.sqlite3
  csv_path: ./logs/trades.csv
